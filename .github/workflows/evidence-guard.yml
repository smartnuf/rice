name: evidence-guard

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

jobs:
  guard:
    name: evidence-guard
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select trusted guard implementation
        run: |
          if git show "$BASE_SHA:scripts/evidence_guard.py" \
              > /tmp/evidence_guard.py 2>/dev/null; then
            echo "guard: using base-revision implementation"
          else
            echo "guard: script absent at base (bootstrap); using head"
            cp scripts/evidence_guard.py /tmp/evidence_guard.py
          fi

      - name: Write PR body to file
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > /tmp/pr_body.txt

      - name: Run evidence guard
        env:
          PR_LABELS: >-
            ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          python3 /tmp/evidence_guard.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --pr-body-file /tmp/pr_body.txt \
            --labels "$PR_LABELS"
